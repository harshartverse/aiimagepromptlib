<!doctype html>
<html lang="en">
  <head>
    <script>
      // Workaround for AI Studio preview environment trying to override fetch
      try {
        if (typeof window !== 'undefined') {
          let _fetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return _fetch; },
            set: function(val) { _fetch = val; },
            configurable: true,
            enumerable: true
          });
        }
      } catch (e) {}
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Image Prompt Library</title>
    <meta name="description" content="A dynamic library of AI-generated images and their corresponding text prompts." />
    <meta property="og:title" content="AI Image Prompt Library" />
    <meta property="og:description" content="A dynamic library of AI-generated images and their corresponding text prompts." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
